site_name: ZipReport Go
site_description: Go implementation of ZipReport - HTML to PDF report generation
site_url: https://zipreport.github.io/zipreport-go
repo_url: https://github.com/zipreport/zipreport-go
repo_name: zipreport/zipreport-go

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
  - User Guide:
      - CLI Usage: cli.md
      - API Reference: api.md
      - Template Filters: filters.md
      - Examples: examples.md
  - Development:
      - Contributing: development.md
      - Architecture: architecture.md
